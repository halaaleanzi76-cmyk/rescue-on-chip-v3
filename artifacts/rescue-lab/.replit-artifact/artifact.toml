kind = "web"
previewPath = "/"
title = "Rescue-on-Chip · Simulation Lab"
description = "Scientific bench-simulation workbench for Neuro-Reflow Rescue 3.0, with reproducible pressure-switching experiments, 2 × 2 perfusate–vessel crossover and explicit model assumptions."
version = "1.0.0"
id = "artifacts/rescue-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22688

[services.development]
run = "pnpm --filter @workspace/rescue-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rescue-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/rescue-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22688"
BASE_PATH = "/"
