openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
- url: /api
paths:
  /healthz:
    get:
      summary: Health
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /model:
    get:
      summary: Model
      operationId: getModel
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
  /summary:
    get:
      summary: Summary
      operationId: getSummary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSummary'
  /runs:
    get:
      summary: Runs
      operationId: listRuns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RunSummary'
                type: array
                title: Response Listruns
    post:
      summary: Run
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentInput'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
  /runs/{run_id}:
    get:
      summary: Get Run
      operationId: getRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
  /runs/{run_id}/visualization:
    get:
      summary: Visualization
      operationId: getRunVisualization
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunVisualization'
  /preview:
    post:
      summary: Preview
      operationId: previewSimulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationPreview'
  /runs/{run_id}/report:
    get:
      summary: Report
      operationId: downloadReport
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Self-contained HTML report, use ?format=csv or json for raw
            data
          content:
            application/json:
              schema: {}
            text/html:
              schema:
                type: string
  /ai/overview:
    get:
      summary: Ai Overview
      operationId: getAIResearchOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIResearchOverview'
  /ai/training:
    get:
      summary: Ai Training Status
      operationId: getAITrainingStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobStatus'
  /ai/train:
    post:
      summary: Start Ai Training
      operationId: startAITraining
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobStatus'
  /ai/models:
    get:
      summary: Ai Models
      operationId: listAIModels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AIModelRegistryEntry'
                type: array
                title: Response Listaimodels
  /ai/models/{model_version}/report:
    get:
      summary: Ai Report
      operationId: downloadAIReproducibilityReport
      parameters:
      - name: model_version
        in: path
        required: true
        schema:
          type: string
          title: Model Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReproducibilityReport'
  /ai/compound/search:
    get:
      summary: Ai Search
      operationId: searchPubChemCompounds
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundSearchResponse'
  /ai/compound/describe:
    post:
      summary: Ai Describe
      operationId: describeCompound
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompoundInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundDescription'
  /ai/compound/conformer:
    post:
      summary: Ai Conformer
      operationId: generateCompoundConformer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompoundInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoleculeConformerResponse'
  /ai/predict:
    post:
      summary: Ai Predict
      operationId: predictCompoundResponse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompoundInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPredictionResponse'
  /evidence/overview:
    get:
      summary: Clinical Evidence Overview
      operationId: getClinicalEvidenceOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalEvidenceOverview'
  /evidence/search:
    get:
      summary: Clinical Evidence Search
      operationId: searchClinicalEvidence
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalEvidenceSearchResponse'
  /evidence/report:
    get:
      summary: Download Evidence Report
      operationId: downloadClinicalEvidenceImportReport
      responses:
        '200':
          description: JSON evidence import report
          content:
            application/json:
              schema: {}
  /evidence/import-log:
    get:
      summary: Download Evidence Import Log
      operationId: downloadClinicalEvidenceImportLog
      responses:
        '200':
          description: Text public API import log
          content:
            application/json:
              schema: {}
  /vascular/network:
    get:
      summary: Get Vascular Network
      operationId: getVascularNetwork
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VascularNetwork'
  /vascular/solve:
    post:
      summary: Solve Vascular Network
      operationId: solveVascularNetwork
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VascularSolveInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VascularSolveResult'
components:
  schemas:
    AIModelRegistryEntry:
      properties:
        model_version:
          type: string
          title: Model Version
        status:
          type: string
          title: Status
        endpoint:
          type: string
          title: Endpoint
        algorithm:
          type: string
          title: Algorithm
        trained_at_utc:
          type: string
          title: Trained At Utc
        eligible_for_reliable_prediction:
          type: boolean
          title: Eligible For Reliable Prediction
        integrity_verified:
          type: boolean
          title: Integrity Verified
        test_metrics:
          additionalProperties: true
          type: object
          title: Test Metrics
      type: object
      required:
      - model_version
      - status
      - endpoint
      - algorithm
      - trained_at_utc
      - eligible_for_reliable_prediction
      - integrity_verified
      - test_metrics
      title: AIModelRegistryEntry
    AIPredictionResponse:
      properties:
        canonical_smiles:
          type: string
          title: Canonical Smiles
        descriptors:
          additionalProperties:
            type: number
          type: object
          title: Descriptors
        endpoint:
          type: string
          title: Endpoint
        evidence:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evidence
        prediction_available:
          type: boolean
          title: Prediction Available
        exploratory_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Exploratory Score
        score_is_calibrated_probability:
          type: boolean
          title: Score Is Calibrated Probability
        uncertainty_available:
          type: boolean
          title: Uncertainty Available
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
        applicability:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Applicability
        nearest_compounds:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Nearest Compounds
        message:
          type: string
          title: Message
        physics_integration:
          type: string
          title: Physics Integration
      type: object
      required:
      - canonical_smiles
      - descriptors
      - endpoint
      - prediction_available
      - score_is_calibrated_probability
      - uncertainty_available
      - nearest_compounds
      - message
      - physics_integration
      title: AIPredictionResponse
    AIReproducibilityReport:
      properties:
        manifest:
          additionalProperties: true
          type: object
          title: Manifest
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
        training_log:
          items:
            type: string
          type: array
          title: Training Log
      type: object
      required:
      - manifest
      - metrics
      - training_log
      title: AIReproducibilityReport
    AIResearchOverview:
      properties:
        dataset:
          additionalProperties: true
          type: object
          title: Dataset
        models:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Models
        latest_model:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Latest Model
        prediction_policy:
          type: string
          title: Prediction Policy
      type: object
      required:
      - dataset
      - models
      - prediction_policy
      title: AIResearchOverview
    Arm:
      properties:
        arm:
          type: string
          title: Arm
        label:
          type: string
          title: Label
        fluid:
          type: integer
          title: Fluid
        vessel:
          type: integer
          title: Vessel
        n:
          type: integer
          title: N
        mean_flow_ul_min:
          type: number
          title: Mean Flow Ul Min
        ci_low:
          type: number
          title: Ci Low
        ci_high:
          type: number
          title: Ci High
        rescue_flow_ul_min:
          type: number
          title: Rescue Flow Ul Min
        normalized_flow_pct:
          type: number
          title: Normalized Flow Pct
        permeability_um_s:
          type: number
          title: Permeability Um S
      type: object
      required:
      - arm
      - label
      - fluid
      - vessel
      - n
      - mean_flow_ul_min
      - ci_low
      - ci_high
      - rescue_flow_ul_min
      - normalized_flow_pct
      - permeability_um_s
      title: Arm
    Chip:
      properties:
        arm:
          type: string
          title: Arm
        fluid:
          type: integer
          title: Fluid
        vessel:
          type: integer
          title: Vessel
        replicate:
          type: integer
          title: Replicate
        radius_um:
          type: number
          title: Radius Um
        flow_ul_min:
          type: number
          title: Flow Ul Min
        rescue_flow_ul_min:
          type: number
          title: Rescue Flow Ul Min
        permeability_um_s:
          type: number
          title: Permeability Um S
      type: object
      required:
      - arm
      - fluid
      - vessel
      - replicate
      - radius_um
      - flow_ul_min
      - rescue_flow_ul_min
      - permeability_um_s
      title: Chip
    ClinicalEvidenceOverview:
      properties:
        sources:
          items:
            $ref: '#/components/schemas/EvidenceSourceStatus'
          type: array
          title: Sources
        table_counts:
          additionalProperties:
            type: integer
          type: object
          title: Table Counts
        clinical_use_classification:
          type: string
          title: Clinical Use Classification
        patient_specific_recommendations_allowed:
          type: boolean
          title: Patient Specific Recommendations Allowed
        safety_efficacy_claims_allowed:
          type: boolean
          title: Safety Efficacy Claims Allowed
      type: object
      required:
      - sources
      - table_counts
      - clinical_use_classification
      - patient_specific_recommendations_allowed
      - safety_efficacy_claims_allowed
      title: ClinicalEvidenceOverview
    ClinicalEvidenceSearchResponse:
      properties:
        query:
          type: string
          title: Query
        trials:
          items:
            $ref: '#/components/schemas/ClinicalTrialEvidenceRecord'
          type: array
          title: Trials
        labels:
          items:
            $ref: '#/components/schemas/FdaLabelEvidenceRecord'
          type: array
          title: Labels
        safety_signals:
          items:
            $ref: '#/components/schemas/FaersSignalEvidenceRecord'
          type: array
          title: Safety Signals
        fetches:
          items:
            $ref: '#/components/schemas/EvidenceFetchRecord'
          type: array
          title: Fetches
        not_covered:
          items:
            type: string
          type: array
          title: Not Covered
      type: object
      required:
      - query
      - trials
      - labels
      - safety_signals
      - fetches
      - not_covered
      title: ClinicalEvidenceSearchResponse
    ClinicalTrialEvidenceRecord:
      properties:
        nct_id:
          type: string
          title: Nct Id
        query_compound:
          type: string
          title: Query Compound
        study_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Study Title
        overall_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Overall Status
        phase:
          anyOf:
          - type: string
          - type: 'null'
          title: Phase
        enrollment:
          anyOf:
          - type: integer
          - type: 'null'
          title: Enrollment
        intervention_names:
          items:
            type: string
          type: array
          title: Intervention Names
        condition_names:
          items:
            type: string
          type: array
          title: Condition Names
        has_posted_results:
          type: boolean
          title: Has Posted Results
        outcome_count:
          type: integer
          title: Outcome Count
        record_url:
          type: string
          title: Record Url
        source_version_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Version Date
        fetched_at:
          type: string
          title: Fetched At
        raw_sha256:
          type: string
          title: Raw Sha256
      type: object
      required:
      - nct_id
      - query_compound
      - study_title
      - overall_status
      - phase
      - enrollment
      - intervention_names
      - condition_names
      - has_posted_results
      - outcome_count
      - record_url
      - source_version_date
      - fetched_at
      - raw_sha256
      title: ClinicalTrialEvidenceRecord
    CompoundDescription:
      properties:
        representation:
          type: string
          title: Representation
        canonical_smiles:
          type: string
          title: Canonical Smiles
        inchi_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Inchi Key
        descriptors:
          additionalProperties:
            type: number
          type: object
          title: Descriptors
        descriptor_note:
          type: string
          title: Descriptor Note
      type: object
      required:
      - representation
      - canonical_smiles
      - descriptors
      - descriptor_note
      title: CompoundDescription
    CompoundInput:
      properties:
        structure:
          type: string
          maxLength: 2048
          minLength: 1
          title: Structure
        representation:
          type: string
          enum:
          - smiles
          - inchi
          title: Representation
          default: smiles
      type: object
      required:
      - structure
      title: CompoundInput
    CompoundSearchItem:
      properties:
        cid:
          type: integer
          title: Cid
        molecular_formula:
          anyOf:
          - type: string
          - type: 'null'
          title: Molecular Formula
        canonical_smiles:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Smiles
        iupac_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Iupac Name
        molecular_weight_da:
          anyOf:
          - type: number
          - type: 'null'
          title: Molecular Weight Da
        source:
          type: string
          title: Source
      type: object
      required:
      - cid
      - source
      title: CompoundSearchItem
    CompoundSearchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/CompoundSearchItem'
          type: array
          title: Results
      type: object
      required:
      - results
      title: CompoundSearchResponse
    Contrast:
      properties:
        name:
          type: string
          title: Name
        value:
          type: number
          title: Value
      type: object
      required:
      - name
      - value
      title: Contrast
    EvidenceFetchRecord:
      properties:
        source_id:
          type: string
          title: Source Id
        request_url:
          type: string
          title: Request Url
        fetched_at:
          type: string
          title: Fetched At
        http_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Http Status
        count_records:
          type: integer
          title: Count Records
        response_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Sha256
        outcome:
          type: string
          title: Outcome
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      type: object
      required:
      - source_id
      - request_url
      - fetched_at
      - http_status
      - count_records
      - response_sha256
      - outcome
      - detail
      title: EvidenceFetchRecord
    EvidenceSourceStatus:
      properties:
        source_id:
          type: string
          title: Source Id
        name:
          type: string
          title: Name
        domain:
          type: string
          title: Domain
        access_mode:
          type: string
          title: Access Mode
        official_url:
          type: string
          title: Official Url
        api_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Base
        contents:
          anyOf:
          - type: string
          - type: 'null'
          title: Contents
        critical_limitations:
          anyOf:
          - type: string
          - type: 'null'
          title: Critical Limitations
        integration_state:
          type: string
          title: Integration State
        latest_request_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Request Url
        latest_fetched_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Fetched At
        latest_http_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Http Status
        latest_record_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Record Count
        latest_response_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Response Sha256
        latest_outcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Outcome
      type: object
      required:
      - source_id
      - name
      - domain
      - access_mode
      - official_url
      - integration_state
      title: EvidenceSourceStatus
    ExperimentInput:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          default: Pressure-equilibrated crossover
        seed:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          default: 42
        replicates:
          type: integer
          maximum: 100.0
          minimum: 3.0
          title: Replicates
          default: 6
        pressure_pa:
          type: number
          maximum: 10000.0
          minimum: 10.0
          title: Pressure Pa
          default: 1000
        radius_um:
          type: number
          maximum: 100.0
          minimum: 5.0
          title: Radius Um
          default: 25
        length_mm:
          type: number
          maximum: 100.0
          minimum: 1.0
          title: Length Mm
          default: 10
        channels:
          type: integer
          maximum: 200.0
          minimum: 1.0
          title: Channels
          default: 16
        viscosity_mpas:
          type: number
          maximum: 10.0
          minimum: 0.5
          title: Viscosity Mpas
          default: 1.2
        altered_viscosity_ratio:
          type: number
          maximum: 5.0
          minimum: 1.0
          title: Altered Viscosity Ratio
          default: 1.8
        narrowing_pct:
          type: number
          maximum: 70.0
          minimum: 0.0
          title: Narrowing Pct
          default: 20
        occlusion_pct:
          type: number
          maximum: 90.0
          minimum: 0.0
          title: Occlusion Pct
          default: 15
        radius_cv_pct:
          type: number
          maximum: 15.0
          minimum: 0.0
          title: Radius Cv Pct
          default: 3
        duration_s:
          type: number
          maximum: 600.0
          minimum: 20.0
          title: Duration S
          default: 60
        switch_s:
          type: number
          maximum: 300.0
          minimum: 1.0
          title: Switch S
          default: 10
        offset_pct:
          type: number
          maximum: 150.0
          minimum: -150.0
          title: Offset Pct
          default: 25
        regulated_tau_s:
          type: number
          maximum: 10.0
          minimum: 0.1
          title: Regulated Tau S
          default: 2
        equalized_tau_s:
          type: number
          maximum: 10.0
          minimum: 0.1
          title: Equalized Tau S
          default: 2
        regulated_wait_s:
          type: number
          maximum: 60.0
          minimum: 0.0
          title: Regulated Wait S
          default: 0
        equalization_s:
          type: number
          maximum: 60.0
          minimum: 0.0
          title: Equalization S
          default: 5
        stop_duration_s:
          type: number
          maximum: 10.0
          minimum: 0.1
          title: Stop Duration S
          default: 1.5
        dead_volume_ul:
          type: number
          maximum: 10.0
          minimum: 0.01
          title: Dead Volume Ul
          default: 0.1
        permeability_um_s:
          type: number
          maximum: 1.0
          minimum: 0.0001
          title: Permeability Um S
          default: 0.01
        injury_permeability_ratio:
          type: number
          maximum: 20.0
          minimum: 1.0
          title: Injury Permeability Ratio
          default: 3
        receiver_volume_ul:
          type: number
          maximum: 100.0
          minimum: 0.1
          title: Receiver Volume Ul
          default: 1
        rescue_fraction:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Rescue Fraction
          default: 0
        barrier_margin_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Barrier Margin Pct
          default: 10
      additionalProperties: false
      type: object
      title: ExperimentInput
    FaersSignalEvidenceRecord:
      properties:
        query_compound:
          type: string
          title: Query Compound
        signal_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Signal Name
        report_count:
          anyOf:
          - type: integer
          - type: 'null'
